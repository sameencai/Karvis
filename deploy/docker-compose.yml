version: '3.8'

services:
  karvis:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: karvis
    restart: unless-stopped
    ports:
      - "9000:9000"
    volumes:
      # 持久化你的数字生活数据
      - karvis_life:/app/my_life
    env_file:
      - ../src/.env
    environment:
      - PROCESS_ENDPOINT_URL=http://127.0.0.1:9000/process

volumes:
  karvis_life:
